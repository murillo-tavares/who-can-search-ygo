services:
  postgres:
    image: postgres:16-alpine
    container_name: who-can-search-ygo-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-who_can_search_ygo}
      POSTGRES_USER: ${POSTGRES_USER:-ygo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ygo}
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ygo} -d ${POSTGRES_DB:-who_can_search_ygo}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: who-can-search-ygo-backend
    environment:
      HTTP_ADDR: :18080
      DATABASE_URL: "postgres://${POSTGRES_USER:-ygo}:${POSTGRES_PASSWORD:-ygo}@postgres:5432/${POSTGRES_DB:-who_can_search_ygo}?sslmode=disable"
    ports:
      - "${BACKEND_PORT:-18080}:18080"
    depends_on:
      seed-fixtures:
        condition: service_completed_successfully

  migrate:
    build:
      context: ./backend
    container_name: who-can-search-ygo-migrate
    command: ["/app/migrate"]
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-ygo}:${POSTGRES_PASSWORD:-ygo}@postgres:5432/${POSTGRES_DB:-who_can_search_ygo}?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy

  seed-fixtures:
    build:
      context: ./backend
    container_name: who-can-search-ygo-seed-fixtures
    command: ["/app/seed-fixtures"]
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-ygo}:${POSTGRES_PASSWORD:-ygo}@postgres:5432/${POSTGRES_DB:-who_can_search_ygo}?sslmode=disable"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
